services:
  db:
    image: mariadb:10.11
    container_name: moodle_db
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: moodle
      MYSQL_USER: moodle
      MYSQL_PASSWORD: moodle
      MYSQL_CHARACTER_SET_SERVER: utf8mb4
      MYSQL_COLLATION_SERVER: utf8mb4_unicode_ci
    volumes:
      - db_data:/var/lib/mysql
    ports:
      - "3307:3306"
    restart: unless-stopped

  mailhog:
    image: mailhog/mailhog:latest
    container_name: moodle_mailhog
    ports:
      - "8025:8025"  # Interfaz web
      - "1025:1025"  # SMTP server
    restart: unless-stopped

  moodle:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: moodle_app
    environment:
      MOODLE_DB_TYPE: mariadb
      MOODLE_DB_HOST: db
      MOODLE_DB_NAME: moodle
      MOODLE_DB_USER: moodle
      MOODLE_DB_PASS: moodle
    volumes:
      # Montar solo archivos del plugin (sin docker-compose, Dockerfile, .git, etc.)
      - ./lib.php:/var/www/html/mod/assign/submission/vidtreo/lib.php
      - ./locallib.php:/var/www/html/mod/assign/submission/vidtreo/locallib.php
      - ./version.php:/var/www/html/mod/assign/submission/vidtreo/version.php
      - ./settings.php:/var/www/html/mod/assign/submission/vidtreo/settings.php
      - ./renderer.php:/var/www/html/mod/assign/submission/vidtreo/renderer.php
      - ./styles.css:/var/www/html/mod/assign/submission/vidtreo/styles.css
      - ./thirdpartylibs.xml:/var/www/html/mod/assign/submission/vidtreo/thirdpartylibs.xml
      - ./db:/var/www/html/mod/assign/submission/vidtreo/db
      - ./lang:/var/www/html/mod/assign/submission/vidtreo/lang
      - ./classes:/var/www/html/mod/assign/submission/vidtreo/classes
      - ./templates:/var/www/html/mod/assign/submission/vidtreo/templates
      - ./amd:/var/www/html/mod/assign/submission/vidtreo/amd
      - ./backup:/var/www/html/mod/assign/submission/vidtreo/backup
      - ./tests:/var/www/html/mod/assign/submission/vidtreo/tests
      - ./check-vidtreo-submissions.php:/var/www/html/mod/assign/submission/vidtreo/check-vidtreo-submissions.php
      - ./show-database-structure.php:/var/www/html/mod/assign/submission/vidtreo/show-database-structure.php
      - ./verify-plugin-config.php:/var/www/html/mod/assign/submission/vidtreo/verify-plugin-config.php
      - ./debug-grader-page.php:/var/www/html/mod/assign/submission/vidtreo/debug-grader-page.php
      - ./test-view-output.php:/var/www/html/mod/assign/submission/vidtreo/test-view-output.php
      # Persistir moodledata
      - moodle_data:/var/www/moodledata
    ports:
      - "8080:80"
    depends_on:
      - db
      - mailhog
    restart: unless-stopped

volumes:
  db_data:
  moodle_data:
